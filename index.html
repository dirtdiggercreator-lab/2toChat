<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <section id="lobby">
    <h1>2chat</h1>
    <p>Приватный чат на двоих. E2E-шифрование.</p>
    <button id="create" class="primary">Создать новый чат</button>
    <div class="sep">— или —</div>
    <input id="inviteInput" placeholder="Вставьте ссылку-приглашение…">
    <button id="joinBtn">Присоединиться</button>
    <p class="hint">Ссылка-приглашение — это и есть ключ. Передайте её по защищённому каналу.</p>
  </section>

  <section id="chat" hidden>
    <header>
      <span id="status">Подключение…</span>
      <button id="leave" class="ghost">Выйти</button>
    </header>
    <div id="inviteBar">
      <input id="inviteLink" readonly>
      <button id="copyBtn">Копировать</button>
    </div>
    <div id="messages"></div>
    <form id="msgForm" autocomplete="off">
      <button type="button" id="attachBtn" class="iconBtn" title="Файл">📎</button>
      <input id="msgInput" placeholder="Сообщение…" autocomplete="off">
      <button type="submit">→</button>
    <button type="button" id="micBtn" class="iconBtn" title="Голос">🎤</button>
    </form>
    <input type="file" id="fileInput" style="display:none">
  </section>

</div>
<script type="module" src="app.js"></script>
</body>
</html>
